# Builds both .deb packages and SHA256SUMS for a version tag (v0.1.0 or 0.1.0) and attaches them to its release.
# - Tag pushed from git, no release yet: opens a *draft* release; nothing is public until the owner presses Publish.
# - Release already made on GitHub's Releases page: the files are added to it.
# - Tag that never got its files: Actions -> release -> Run workflow, with the tag name.
name: release

on:
  push:
    tags: ['v*', '[0-9]*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and attach files to (e.g. 0.1.0)
        required: true

permissions:
  contents: write # create the release or upload its files

jobs:
  release:
    runs-on: ubuntu-24.04
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Tag matches VERSION
        run: test "${TAG#v}" = "$(cat VERSION)" || { echo "tag $TAG but VERSION says $(cat VERSION)"; exit 1; }

      - name: Image tools for the tests
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libvips-tools libimage-exiftool-perl ffmpeg

      - name: Build and test
        run: make all test

      - name: Packages
        run: |
          make deb deb-pi
          sha256sum picburrow_*.deb > SHA256SUMS
          cat SHA256SUMS

      - name: Release files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" picburrow_*.deb SHA256SUMS --clobber
          else
            gh release create "$TAG" picburrow_*.deb SHA256SUMS --draft --title "Picburrow $(cat VERSION)" --generate-notes
          fi
